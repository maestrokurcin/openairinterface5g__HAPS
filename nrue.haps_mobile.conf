# HAPS_MOBILE test - UE side conf. Mirrors nrue.haps.conf, channelmod type
# switched to HAPS_MOBILE (loiter circle + real-time Doppler, see Adim 7).

uicc0 = {
  imsi = "001010000000001";
  key = "fec86ba6eb707ed08905757b1bb44b8f";
  opc= "C42449363BBAD02B66D16BC975D77CC1";
  pdu_sessions = ({ dnn = "oai"; nssai_sst = 1; });
}

rfsimulator = (
  {
    serveraddr = "127.0.0.1";
    options = ("chanmod");
    # NOT: prop_delay yok - HAPS_MOBILE icin gecikme kanal modeli tarafindan
    # gercek zamanda (loiter konumundan) hesaplaniyor, bkz. Adim 7.
  }
);

#/* configuration for channel modelisation */
#/* To be included in main config file when */
#/* channel modelisation is used (rfsimulator with chanmod options enabled) */
channelmod = {
  max_chan = 10;
  modellist = "modellist_rfsimu_1";
  modellist_rfsimu_1 = (
    { # DL, modify on UE side
      model_name     = "rfsimu_channel_enB0"
      type           = "HAPS_MOBILE";
      ploss_dB       = 20.0;
      noise_power_dB = -110.0;
      forgetfact     = 0.0;
      offset         = 0;
      ds_tdl         = 0.0;
    },
    { # UL, modify on gNB side
      model_name     = "rfsimu_channel_ue0"
      type           = "HAPS_MOBILE";
      ploss_dB       = 20.0;
      noise_power_dB = -110.0;
      forgetfact     = 0.0;
      offset         = 0;
      ds_tdl         = 0.0;
    }
  );
};
