#
# NTN scenario: MOBILE HAPS (loiter circle + real Doppler) + real ntn_Config_r17/SIB19,
# same as gnb.haps_mobile_ntn.conf (Adim 13), EXCEPT path_loss_dB is no longer a static
# config number: type="HAPS_MOBILE_38811" makes apply_channelmod.c recompute it every
# second from the 3GPP TR 38.811 S6.6.2 basic path loss model (real FSPL from the
# actual simulated slant range + elevation-dependent shadow fading), on top of a
# calibrated (non-3GPP) gain budget. See HAPS_GELISTIRME_GUNLUGU.md Adim 15.
#
# The ploss_dB value below is only the INITIAL value used before the first update
# (roughly 1 second after client connect) - after that it is overwritten dynamically.
#
# 2x2 variant (Adim 30): identical to gnb.haps_mobile_ntn_38811.conf except
# nb_tx/nb_rx = 2 (RUs block below) and pdsch_AntennaPorts_XP/pusch_AntennaPorts
# = 2 - exercises haps_update_tdl_taps()'s new 2x2 spatial-correlation path
# (see openair1/SIMULATION/TOOLS/haps_tdl.c). Antenna port config keys copied
# from the existing ci-scripts/conf_files/gnb.sa.band78.273prb.rfsim.2x2.conf
# reference, the only other 2x2 rfsim config in this repo.

channelmod = {
  max_chan = 10;
  modellist = "haps_channel_list";
  haps_channel_list = (
    {
      model_name     = "rfsimu_channel_enB0";
      type           = "HAPS_MOBILE_38811";
      ploss_dB       = 20.0;
      noise_power_dB = -110.0;
      forgetfact     = 0.0;
      offset         = 0;
      ds_tdl         = 0.0;
    },
    {
      model_name     = "rfsimu_channel_ue0";
      type           = "HAPS_MOBILE_38811";
      ploss_dB       = 20.0;
      noise_power_dB = -110.0;
      forgetfact     = 0.0;
      offset         = 0;
      ds_tdl         = 0.0;
    }
  );
};

Active_gNBs = ( "5G-HAPS-gNB");
# Asn1_verbosity, choice in: none, info, annoying
Asn1_verbosity = "none";

gNBs =
(
 {
    ////////// Identification parameters:
    gNB_ID    =  0xe00;
    gNB_name  =  "5G-HAPS-gNB";

    # Tracking area code, 0x0000 and 0xfffe are reserved values
    tracking_area_code  =  1;
    plmn_list = ({ mcc = 208; mnc = 99; mnc_length = 2; snssaiList = ({ sst = 1, sd = 0xffffff }) });
    nr_cellid = 12345678L;

    ////////// Physical parameters:

    CSI_report_type = "ssb_sinr";
    min_rxtxtime                                              = 6;
    cu_sibs = [2];
    du_sibs = [19];
    pdsch_AntennaPorts_XP                                     = 2;
    pusch_AntennaPorts                                        = 2;

    servingCellConfigCommon = (
    {
 #spCellConfigCommon

      physCellId                                                    = 0;

#  downlinkConfigCommon
    #frequencyInfoDL
      # GSCN 6221
      absoluteFrequencySSB                                          = 497770;
      dl_frequencyBand                                              = 254;
      # this is 2486.15 MHz
      dl_absoluteFrequencyPointA                                    = 497230;
      #scs-SpecificCarrierList
        dl_offstToCarrier                                           = 0;
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
        dl_subcarrierSpacing                                        = 0;
        dl_carrierBandwidth                                         = 25;
     #initialDownlinkBWP
      #genericParameters
        # this is RBstart=0,L=25 (275*(L-1))+RBstart
        initialDLBWPlocationAndBandwidth                            = 6600;
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
        initialDLBWPsubcarrierSpacing                               = 0;
      #pdcch-ConfigCommon
        initialDLBWPcontrolResourceSetZero                          = 2;
        initialDLBWPsearchSpaceZero                                 = 2;

  #uplinkConfigCommon
     #frequencyInfoUL
      ul_frequencyBand                                              = 254;
      # this is 1612.65 MHz
      ul_absoluteFrequencyPointA                                    = 322530;
      #scs-SpecificCarrierList
      ul_offstToCarrier                                             = 0;
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
      ul_subcarrierSpacing                                          = 0;
      ul_carrierBandwidth                                           = 25;
      pMax                                                          = 20;
     #initialUplinkBWP
      #genericParameters
        initialULBWPlocationAndBandwidth                            = 6600;
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
        initialULBWPsubcarrierSpacing                               = 0;
      #rach-ConfigCommon
        #rach-ConfigGeneric
          prach_ConfigurationIndex                                  = 7;
#prach_msg1_FDM
#0 = one, 1=two, 2=four, 3=eight
          prach_msg1_FDM                                            = 0;
          prach_msg1_FrequencyStart                                 = 0;
          zeroCorrelationZoneConfig                                 = 15;
          preambleReceivedTargetPower                               = -118;
#preamblTransMax (0...10) = (3,4,5,6,7,8,10,20,50,100,200)
          preambleTransMax                                          = 6;
#powerRampingStep
# 0=dB0,1=dB2,2=dB4,3=dB6
        powerRampingStep                                            = 1;
#ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR
#1=oneeighth,2=onefourth,3=half,4=one,5=two,6=four,7=eight,8=sixteen
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR                = 4;
#one (0..15) 4,8,12,16,...60,64
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB                   = 15;
#ra_ContentionResolutionTimer
#(0..7) 8,16,24,32,40,48,56,64
        ra_ContentionResolutionTimer                                = 7;
        rsrp_ThresholdSSB                                           = 19;
#prach-RootSequenceIndex_PR
#1 = 839, 2 = 139
        prach_RootSequenceIndex_PR                                  = 1;
        prach_RootSequenceIndex                                     = 1;
        # SCS for msg1, can only be 15 for 30 kHz < 6 GHz, takes precendence over the one derived from prach-ConfigIndex
        # not allowed when format < 4
        # msg1_SubcarrierSpacing                                      = 0;
# restrictedSetConfig
# 0=unrestricted, 1=restricted type A, 2=restricted type B
        restrictedSetConfig                                         = 0;

        msg3_DeltaPreamble                                          = 1;
        p0_NominalWithGrant                                         =-90;

# pucch-ConfigCommon setup :
# pucchGroupHopping
# 0 = neither, 1= group hopping, 2=sequence hopping
        pucchGroupHopping                                           = 0;
        hoppingId                                                   = 40;
        p0_nominal                                                  = -90;

      ssb_PositionsInBurst_Bitmap                                   = 1;

# ssb_periodicityServingCell
# 0 = ms5, 1=ms10, 2=ms20, 3=ms40, 4=ms80, 5=ms160, 6=spare2, 7=spare1
      ssb_periodicityServingCell                                    = 2;

# dmrs_TypeA_position
# 0 = pos2, 1 = pos3
      dmrs_TypeA_Position                                           = 0;

# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
      subcarrierSpacing                                             = 0;


  #tdd-UL-DL-ConfigurationCommon
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
      referenceSubcarrierSpacing                                    = 0;
      # pattern1
      # dl_UL_TransmissionPeriodicity
      # 0=ms0p5, 1=ms0p625, 2=ms1, 3=ms1p25, 4=ms2, 5=ms2p5, 6=ms5, 7=ms10
      dl_UL_TransmissionPeriodicity                                 = 6;
      nrofDownlinkSlots                                             = 7;
      nrofDownlinkSymbols                                           = 6;
      nrofUplinkSlots                                               = 2;
      nrofUplinkSymbols                                             = 4;

      ssPBCH_BlockPower                                             = -25;

  #ext2
    #ntn_Config_r17
      # Initial/placeholder values only: once a client connects and
      # HAPS_MOBILE_38811's update_channel_model() starts running, nr_update_sib19()
      # (apply_channelmod.c) overwrites ta-Common-r17/position/velocity every
      # 10 ms with the real, moving loiter-circle geometry. These starting
      # values just need to be in the right ballpark for the first SSB/SIB19
      # broadcast before that happens.
      ntn-UlSyncValidityDuration-r17                                = 240;
      cellSpecificKoffset_r17                                       = 1;
      ta-Common-r17                                                 = 0;
      positionX-r17                                                 = 0;
      positionY-r17                                                 = 0;
      positionZ-r17                                                 = 4921538; # ~20 km altitude
      velocityVX-r17                                                = 0;
      velocityVY-r17                                                = 0;
      velocityVZ-r17                                                = 0;
  }

  );

    # ------- SCTP definitions
    SCTP :
    {
        # Number of streams to use in input/output
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };


    ////////// AMF parameters:
    amf_ip_address = ({ ipv4 = "192.168.71.132"; });

    NETWORK_INTERFACES :
    {
        GNB_IPV4_ADDRESS_FOR_NG_AMF              = "192.168.71.140/26";
        GNB_IPV4_ADDRESS_FOR_NGU                 = "192.168.71.140/26";
        GNB_PORT_FOR_S1U                         = 2152; # Spec 2152
    };

  }
);

rlc = {
  srb = {
    t_poll_retransmit = "ms2000"
  }
  drb_am = {
    t_poll_retransmit = "ms2000"
  }
}

MACRLCs = (
{
  tr_s_preference             = "local_L1";
  tr_n_preference             = "local_RRC";
  pusch_TargetSNRx10          = 150;
  pucch_TargetSNRx10          = 200;
  dl_max_mcs                  = 9;
  ul_max_mcs                  = 9;
}
);

L1s = (
{
  tr_n_preference       = "local_mac";
  prach_dtx_threshold   = 150;
  pucch0_dtx_threshold  = 150;
  ofdm_offset_divisor   = 8; #set this to UINT_MAX for offset 0
}
);

RUs = (
    {
         local_rf       = "yes";
         nb_tx          = 2;
         nb_rx          = 2;
         att_tx         = 0;
         att_rx         = 0;
         bands          = [7];
         max_pdschReferenceSignalPower = -27;
         max_rxgain                    = 114;
         sf_extension                  = 0;
         eNB_instances  = [0];
         sdr_addrs = "type=x300";
         clock_src = "internal";
         # if_freq = 3700000000L;
         # if_offset = 1000000;
    }
);

rfsimulator = (
{
  serveraddr = "server";
  serverport = 4043;
  options = ("chanmod"); # HAPS_MOBILE_38811 channel model handles delay/Doppler/path loss dynamically
  IQfile = "/tmp/rfsimulator.iqs";
}
);

security = {
  # preferred ciphering algorithms
  # the first one of the list that an UE supports in chosen
  # valid values: nea0, nea1, nea2, nea3
  ciphering_algorithms = ( "nea0" );

  # preferred integrity algorithms
  # the first one of the list that an UE supports in chosen
  # valid values: nia0, nia1, nia2, nia3
  integrity_algorithms = ( "nia2", "nia0" );

  # setting 'drb_ciphering' to "no" disables ciphering for DRBs, no matter
  # what 'ciphering_algorithms' configures; same thing for 'drb_integrity'
  drb_ciphering = "yes";
  drb_integrity = "no";
};

log_config :
{
  global_log_level                      ="info";
  hw_log_level                          ="info";
  phy_log_level                         ="info";
  mac_log_level                         ="info";
  rlc_log_level                         ="info";
  pdcp_log_level                        ="info";
  rrc_log_level                         ="info";
};
