# HAPS test - UE side conf. Mirrors ci-scripts/conf_files/nrue.uicc.conf,
# with the channelmod list switched to the new "HAPS" model type
# (openair1/SIMULATION/TOOLS/random_channel.c / sim.h) instead of AWGN.

uicc0 = {
  imsi = "001010000000001";
  key = "fec86ba6eb707ed08905757b1bb44b8f";
  opc= "C42449363BBAD02B66D16BC975D77CC1";
  pdu_sessions = ({ dnn = "oai"; nssai_sst = 1; });
}

rfsimulator = (
  {
    serveraddr = "127.0.0.1";
    options = ("chanmod");
    prop_delay = 0.06671; # 20 km / c tek yon sabit gecikme (ms) - HAPS_STATIONARY icin (bkz. Adim 5 ve Adim 7)
  }
);

#/* configuration for channel modelisation */
#/* To be included in main config file when */
#/* channel modelisation is used (rfsimulator with chanmod options enabled) */
channelmod = {
  max_chan = 10;
  modellist = "modellist_rfsimu_1";
  modellist_rfsimu_1 = (
    { # DL, modify on UE side
      model_name     = "rfsimu_channel_enB0"
      type           = "HAPS_STATIONARY"; # sabit HAPS, statik prop_delay kullanir (bkz. Adim 7)
      ploss_dB       = 20.0; # NOT: gercek FSPL (-129.64 dB) denendi, baglanti koptu - bkz. HAPS_GELISTIRME_GUNLUGU.md Adim 6
      noise_power_dB = -110.0;
      forgetfact     = 0.0;
      offset         = 0;
      ds_tdl         = 0.0;
    },
    { # UL, modify on gNB side
      model_name     = "rfsimu_channel_ue0"
      type           = "HAPS_STATIONARY"; # sabit HAPS, statik prop_delay kullanir (bkz. Adim 7)
      ploss_dB       = 20.0; # NOT: gercek FSPL (-129.64 dB) denendi, baglanti koptu - bkz. HAPS_GELISTIRME_GUNLUGU.md Adim 6
      noise_power_dB = -110.0;
      forgetfact     = 0.0;
      offset         = 0;
      ds_tdl         = 0.0;
    }
  );
};
